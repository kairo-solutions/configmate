[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "configmate"
version = "0.1.0"
description = "A simple, powerful configuration management library for Python"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "GdAyo19", email = "theyagolarewaju@gmail.com"}
]
keywords = ["configuration", "settings", "environment", "devops", "stellar"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/kairo-solutions/configmate"
Documentation = "https://github.com/kairo-solutions/configmate#readme"

[project.scripts]
configmate = "configmate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
