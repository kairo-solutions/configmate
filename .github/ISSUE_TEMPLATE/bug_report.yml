name: Bug report
description: Report a reproducible problem in ConfigMate
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include secrets or sensitive configuration values.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and why is it a problem?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest code sample or configuration that reproduces it.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: State what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ConfigMate and Python versions
      placeholder: "ConfigMate 0.1.0, Python 3.11"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and any relevant runtime details.
    validations:
      required: true
