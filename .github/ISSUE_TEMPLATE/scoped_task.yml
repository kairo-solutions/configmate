name: Scoped task
description: Propose a bounded improvement with clear acceptance criteria
title: "[Task]: "
body:
  - type: textarea
    id: context
    attributes:
      label: Problem and impact
      description: Who is affected, and why should this be addressed?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe the observable result when this task is complete.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List specific conditions that can be checked during review.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: Keep the work bounded; state what is not part of this task.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Name relevant tests, documentation checks, or reproduction steps.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and references
      description: Link prerequisite issues, affected code/docs, and useful references.
