site_name: ConfigMate
site_description: A simple, powerful configuration management library for Python
site_author: Kairo Solutions
site_url: https://kairo-solutions.github.io/configmate/

repo_url: https://github.com/kairo-solutions/configmate
repo_name: kairo-solutions/configmate

copyright: Copyright &copy; 2023 - 2026 Kairo Solutions

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.annotate

extra_css:
  - assets/stylesheets/documentation.css

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Configuration:
      - Usage: configuration/usage.md
      - Stellar Configuration: configuration/stellar.md
  - API Reference:
      - Config: api/config.md
      - StellarConfig: api/stellar_config.md
      - ValidationError: api/validation_error.md
  - Examples:
      - Basic: examples/basic.md
      - Stellar: examples/stellar.md
  - About:
      - Changelog: about/changelog.md
      - Contributing: about/contributing.md
      - License: about/license.md